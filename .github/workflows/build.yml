name: Build MobileIDE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-global-

    - name: Cache local .buildozer
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-local-

    - name: Build APK (Clean cache & fix NDK)
      run: |
        docker run --rm \
          -e HOME=/home/user \
          -v "${{ github.workspace }}":/home/user/hostcwd \
          -v "$HOME/.buildozer":/home/user/.buildozer \
          --entrypoint /bin/bash \
          kivy/buildozer -c "mkdir -p /home/user/bin && ln -sf \$(which python3) /home/user/bin/python3.11 && export PATH=/home/user/bin:\$PATH && rm -rf .buildozer/android/platform/python-for-android .buildozer/android/platform/build-arm64-v8a && yes | buildozer -v android debug"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MobileIDE-Debug-APK
        path: bin/*.apk
        if-no-files-found: error