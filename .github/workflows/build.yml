name: Build MobileIDE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Клонируем p4a заранее, чтобы Action не делал это внутри контейнера (экономит время и память)
    - name: Configure git for large clones
      run: |
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 0

    - name: Clone python-for-android
      run: |
        git clone --depth 1 https://github.com/kivy/python-for-android.git ./python-for-android

    # Кэшируем глобальную директорию Buildozer (SDK, NDK)
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-global-

    # Кэшируем локальную директорию сборки (результаты компиляции)
    - name: Cache local .buildozer
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-local-

    # Используем готовый Action с официальным Docker-образом
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        workdir: .
        buildozer_version: stable
        # Если нужно ограничить память, можно передать переменную окружения
        # env:
        #   MAKE_JOBS: 1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MobileIDE-Debug-APK
        path: ${{ steps.buildozer.outputs.filename }}
        if-no-files-found: error